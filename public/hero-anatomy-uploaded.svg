<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="100%" height="100%" className="w-full h-full select-none">
  <defs>
    <!-- Background Laboratory Gradients -->
    <radialGradient id="labBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="50%" stop-color="#0b111c" />
      <stop offset="100%" stop-color="#05080e" />
    </radialGradient>
    
    <linearGradient id="hudCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="organBrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <radialGradient id="organHeart" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="80%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <linearGradient id="organLungs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="organLiver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="organIntestines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <linearGradient id="bodyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Lab Environment -->
  <rect width="1000" height="562" fill="url(#labBg)" />
  
  <!-- Subtle Lab Equipment & Benchmarks Silhouettes -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1" fill="none">
    <!-- Lab Shelf & Bench -->
    <line x1="0" y1="440" x2="1000" y2="440" stroke-width="2" stroke="#1e293b" />
    <line x1="0" y1="460" x2="1000" y2="460" stroke-width="1" stroke="#0f172a" />
    
    <!-- Lab Flasks Left -->
    <path d="M 60 440 L 75 400 L 75 375 L 85 375 L 85 400 L 100 440 Z" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" />
    <path d="M 120 440 L 120 360 L 135 360 L 135 440 Z" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" />
    <line x1="40" y1="360" x2="160" y2="360" stroke="#334155" stroke-dasharray="3 3" />

    <!-- Lab Flasks Right -->
    <path d="M 880 440 L 895 390 L 895 365 L 905 365 L 905 390 L 920 440 Z" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" />
    <path d="M 940 440 L 940 370 L 955 370 L 955 440 Z" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" />
  </g>

  <!-- 2. Left Holographic HUD Displays -->
  <g transform="translate(60, 40)" opacity="0.85" filter="url(#glowCyan)">
    <!-- Main Floating Screen Frame -->
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#031526" fill-opacity="0.4" stroke="#0284c7" stroke-width="1.5" />
    <path d="M 0 24 L 220 24" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="14" cy="12" r="3" fill="#38bdf8" />
    <circle cx="26" cy="12" r="3" fill="#0284c7" />
    <text x="38" y="16" font-family="monospace" font-size="9" fill="#7dd3fc" font-weight="bold">SYSTEM TELEMETRY HUD</text>

    <!-- Waveform & Data Bars -->
    <path d="M 15 70 Q 35 40 55 70 T 95 70 T 135 45 T 175 75 T 205 60" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 15 105 L 45 105 M 55 105 L 95 105 M 105 105 L 155 105 M 165 105 L 205 105" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <path d="M 15 125 L 85 125 M 95 125 L 140 125 M 150 125 L 180 125" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Circular HUD Target Scanner -->
    <circle cx="170" cy="50" r="18" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 2" />
    <circle cx="170" cy="50" r="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- 3. Right Floating DNA Double Helix & Cell Display -->
  <g transform="translate(730, 20)" opacity="0.9" filter="url(#glowCyan)">
    <!-- Right HUD Panel -->
    <rect x="0" y="80" width="200" height="130" rx="10" fill="#031526" fill-opacity="0.4" stroke="#0284c7" stroke-width="1.5" />
    <text x="16" y="102" font-family="monospace" font-size="9" fill="#7dd3fc" font-weight="bold">GENOMIC CELL MATRIX</text>
    <circle cx="80" cy="150" r="32" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="80" cy="150" r="20" fill="#e11d48" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="80" cy="150" r="8" fill="#fda4af" />
    
    <!-- DNA Strand Floating -->
    <g transform="translate(130, 0)">
      <!-- DNA Helical Strands -->
      <path d="M 20 10 Q 45 40 20 70 Q -5 100 20 130 Q 45 160 20 190 Q -5 220 20 250 Q 45 280 20 310 Q -5 340 20 370" fill="none" stroke="#38bdf8" stroke-width="3" />
      <path d="M 20 10 Q -5 40 20 70 Q 45 100 20 130 Q -5 160 20 190 Q 45 220 20 250 Q -5 280 20 310 Q 45 340 20 370" fill="none" stroke="#60a5fa" stroke-width="3" />
      
      <!-- Base Pairs Rungs -->
      <line x1="8" y1="25" x2="32" y2="25" stroke="#f43f5e" stroke-width="2" />
      <line x1="5" y1="55" x2="35" y2="55" stroke="#38bdf8" stroke-width="2" />
      <line x1="8" y1="85" x2="32" y2="85" stroke="#fbbf24" stroke-width="2" />
      <line x1="5" y1="115" x2="35" y2="115" stroke="#34d399" stroke-width="2" />
      <line x1="8" y1="145" x2="32" y2="145" stroke="#f43f5e" stroke-width="2" />
      <line x1="5" y1="175" x2="35" y2="175" stroke="#38bdf8" stroke-width="2" />
      <line x1="8" y1="205" x2="32" y2="205" stroke="#fbbf24" stroke-width="2" />
      <line x1="5" y1="235" x2="35" y2="235" stroke="#34d399" stroke-width="2" />
      <line x1="8" y1="265" x2="32" y2="265" stroke="#f43f5e" stroke-width="2" />
      <line x1="5" y1="295" x2="35" y2="295" stroke="#38bdf8" stroke-width="2" />
      <line x1="8" y1="325" x2="32" y2="325" stroke="#fbbf24" stroke-width="2" />
      <line x1="5" y1="355" x2="35" y2="355" stroke="#34d399" stroke-width="2" />

      <!-- Glowing Molecules -->
      <circle cx="5" cy="55" r="4" fill="#38bdf8" filter="url(#glowStrong)" />
      <circle cx="35" cy="115" r="4" fill="#34d399" filter="url(#glowStrong)" />
      <circle cx="5" cy="175" r="4" fill="#f43f5e" filter="url(#glowStrong)" />
      <circle cx="35" cy="235" r="4" fill="#fbbf24" filter="url(#glowStrong)" />
    </g>
  </g>

  <!-- 4. Floating Atmospheric Biometric Particles -->
  <g opacity="0.6">
    <circle cx="260" cy="270" r="14" fill="#e11d48" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="260" cy="270" r="5" fill="#fda4af" />
    
    <circle cx="755" cy="410" r="16" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="755" cy="410" r="6" fill="#7dd3fc" />

    <circle cx="590" cy="80" r="12" fill="#f43f5e" fill-opacity="0.35" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="590" cy="80" r="4" fill="#fda4af" />

    <circle cx="590" cy="130" r="10" fill="#f43f5e" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="590" cy="130" r="3.5" fill="#fda4af" />

    <circle cx="830" cy="450" r="12" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="970" cy="285" r="14" fill="#e11d48" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1.5" />
  </g>

  <!-- 5. Central 3D Human Anatomy Hologram -->
  <g transform="translate(500, 280)">
    <!-- Holographic Pedestal Glow -->
    <ellipse cx="0" cy="270" rx="140" ry="20" fill="#38bdf8" fill-opacity="0.15" filter="url(#glowStrong)" />
    <ellipse cx="0" cy="270" rx="110" ry="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- A. Translucent Glass-Body Silhouette & Outlines -->
    <g stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.7" fill="url(#bodyGlass)">
      <!-- Head / Cranium -->
      <path d="M 0 -265 C -32 -265 -42 -235 -40 -195 C -38 -165 -22 -145 -18 -135 L -16 -115 L 16 -115 L 18 -135 C 22 -145 38 -165 40 -195 C 42 -235 32 -265 0 -265 Z" />
      
      <!-- Torso & Shoulders -->
      <path d="M -16 -115 C -45 -110 -95 -85 -115 -40 C -128 5 -145 70 -160 145 C -168 185 -180 230 -185 260 L -155 260 C -145 220 -130 150 -115 80 C -105 30 -90 -10 -75 -40 L -75 50 C -75 110 -65 160 -55 270 L 55 270 C 65 160 75 110 75 50 L 75 -40 C 90 -10 105 30 115 80 C 130 150 145 220 155 260 L 185 260 C 180 230 168 185 160 145 C 145 70 128 5 115 -40 C 95 -85 45 -110 16 -115 Z" />

      <!-- Pelvis & Upper Legs -->
      <path d="M -55 170 C -70 200 -70 270 -60 280 L 60 280 C 70 270 70 200 55 170 Z" fill-opacity="0.2" />
    </g>

    <!-- B. Internal Organs & Systems -->

    <!-- 1. The Brain & Cranial Sulci (Glowing Pink/Red) -->
    <g transform="translate(0, -210)" filter="url(#glowRed)">
      <!-- Left & Right Cerebral Hemispheres -->
      <ellipse cx="-12" cy="0" rx="16" ry="24" fill="url(#organBrain)" />
      <ellipse cx="12" cy="0" rx="16" ry="24" fill="url(#organBrain)" />
      <ellipse cx="0" cy="5" rx="22" ry="18" fill="url(#organBrain)" />
      <!-- Cerebrum Sulci Fissures -->
      <path d="M -20 -10 Q -10 -15 -2 -5 Q 6 -15 18 -10 M -22 5 Q -10 0 0 10 Q 12 0 22 5 M -15 18 Q -5 12 0 22 Q 8 12 16 18 M 0 -22 L 0 24" fill="none" stroke="#fecdd3" stroke-width="1.8" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#glowStrong)" opacity="0.7" />
    </g>

    <!-- 2. Brainstem & Spinal Cord (Blue / Red neural conduits) -->
    <g transform="translate(0, -170)">
      <line x1="-3" y1="0" x2="-3" y2="80" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="3" y1="0" x2="3" y2="80" stroke="#ef4444" stroke-width="2.5" />
      <line x1="0" y1="0" x2="0" y2="80" stroke="#f8fafc" stroke-width="1" stroke-dasharray="2 2" />
    </g>

    <!-- 3. Lungs & Bronchial Tree -->
    <g transform="translate(0, -35)" opacity="0.85">
      <!-- Right Lung (Anatomical Left) -->
      <path d="M -12 -55 C -35 -45 -55 -10 -52 35 C -50 65 -35 70 -16 60 C -12 40 -10 -20 -12 -55 Z" fill="url(#organLungs)" stroke="#fb7185" stroke-width="1.5" filter="url(#glowRed)" />
      <!-- Left Lung (Anatomical Right) -->
      <path d="M 12 -55 C 35 -45 55 -10 52 35 C 50 65 35 70 16 60 C 12 40 10 -20 12 -55 Z" fill="url(#organLungs)" stroke="#fb7185" stroke-width="1.5" filter="url(#glowRed)" />
    </g>

    <!-- 4. Heart & Great Vessels (Coronary Vasculature) -->
    <g transform="translate(-2, -20)" filter="url(#glowRed)">
      <!-- Aorta & Pulmonary Arteries Top -->
      <path d="M -5 -30 C -5 -42 12 -42 12 -28 L 12 -15" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
      <path d="M -12 -22 C -18 -32 -2 -32 -2 -18" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />

      <!-- Main Heart Ventricles Body -->
      <path d="M 0 -20 C -22 -20 -28 5 -15 25 C -5 40 0 50 2 52 C 5 50 18 35 24 15 C 30 -5 18 -20 0 -20 Z" fill="url(#organHeart)" stroke="#f87171" stroke-width="2" />
      
      <!-- Coronary Arteries & Veins Branches -->
      <path d="M 2 -10 Q -6 8 -2 28 Q 0 38 2 45" fill="none" stroke="#fecaca" stroke-width="2" />
      <path d="M 8 -5 Q 16 12 12 25" fill="none" stroke="#38bdf8" stroke-width="1.8" />
      <circle cx="0" cy="10" r="3" fill="#ffffff" filter="url(#glowStrong)" />
    </g>

    <!-- 5. Liver & Stomach -->
    <g transform="translate(0, 42)">
      <!-- Liver (Anatomical Right / Viewer Left) -->
      <path d="M -48 -10 C -15 -18 10 -15 15 5 C 15 25 -10 32 -42 22 C -52 18 -52 0 -48 -10 Z" fill="url(#organLiver)" stroke="#d97706" stroke-width="1.5" />
      <!-- Stomach (Anatomical Left / Viewer Right) -->
      <path d="M 8 -8 C 28 -12 40 8 36 26 C 32 38 18 35 12 24 C 6 12 4 0 8 -8 Z" fill="#991b1b" fill-opacity="0.85" stroke="#f87171" stroke-width="1.5" />
    </g>

    <!-- 6. Intestines & Digestive Tract (Golden-Orange Convoluted Loops) -->
    <g transform="translate(0, 115)" filter="url(#glowRed)">
      <!-- Large Colon Frame -->
      <path d="M -38 -25 L -38 45 C -38 65 -25 72 0 72 C 25 72 38 65 38 45 L 38 -25 C 38 -38 20 -38 0 -38 C -20 -38 -38 -38 -38 -25 Z" fill="none" stroke="#c2410c" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity="0.9" />
      
      <!-- Small Intestine Inner Coils -->
      <path d="M -22 -15 Q -5 -25 15 -15 Q 22 -5 5 0 Q -18 5 -20 18 Q -10 28 12 25 Q 20 35 -5 40 Q -18 42 -8 50 Q 8 52 18 48" fill="none" stroke="url(#organIntestines)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -15 -8 Q 0 -12 12 -5 Q 15 8 -2 10 Q -14 12 -12 22 Q 0 30 15 28" fill="none" stroke="#fed7aa" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- 7. Major Systemic Vasculature (Vibrant Red Arteries & Blue Veins) -->
    <g stroke-linecap="round" filter="url(#glowStrong)" opacity="0.9">
      <!-- Arterial Tree (Red) -->
      <g stroke="#ef4444" stroke-width="2.2" fill="none">
        <!-- Neck to Cranium -->
        <path d="M -4 -120 L -12 -180 L -22 -220 M -12 -180 L 0 -240" />
        <path d="M 4 -120 L 12 -180 L 22 -220 M 12 -180 L 0 -240" />
        <!-- Shoulders & Arms Left -->
        <path d="M -15 -90 C -45 -85 -85 -55 -105 0 C -120 40 -135 110 -150 180 L -165 245" />
        <path d="M -105 0 L -85 50 M -135 110 L -120 160" stroke-width="1.4" />
        <!-- Shoulders & Arms Right -->
        <path d="M 15 -90 C 45 -85 85 -55 105 0 C 120 40 135 110 150 180 L 165 245" />
        <path d="M 105 0 L 85 50 M 135 110 L 120 160" stroke-width="1.4" />
        <!-- Iliac & Femoral Arteries Down -->
        <path d="M -10 170 L -28 220 L -38 275" />
        <path d="M 10 170 L 28 220 L 38 275" />
      </g>

      <!-- Venous Tree (Blue) -->
      <g stroke="#0284c7" stroke-width="2.2" fill="none">
        <!-- Jugular & Superior Vena Cava -->
        <path d="M -8 -120 L -16 -175 L -10 -225" />
        <path d="M 8 -120 L 16 -175 L 10 -225" />
        <!-- Arms Veins Left -->
        <path d="M -20 -95 C -48 -88 -88 -50 -108 8 C -123 48 -138 118 -153 185 L -168 250" />
        <!-- Arms Veins Right -->
        <path d="M 20 -95 C 48 -88 88 -50 108 8 C 123 48 138 118 153 185 L 168 250" />
        <!-- Inferior Vena Cava & Iliac Veins -->
        <path d="M -5 170 L -22 220 L -32 275" />
        <path d="M 5 170 L 22 220 L 32 275" />
      </g>
    </g>

    <!-- 8. Neural Synaptic Flashes (Glowing Nodes) -->
    <g fill="#38bdf8" filter="url(#glowStrong)">
      <circle cx="-165" cy="245" r="2.5" />
      <circle cx="165" cy="245" r="2.5" />
      <circle cx="-105" cy="0" r="2" />
      <circle cx="105" cy="0" r="2" />
      <circle cx="0" cy="-240" r="3" fill="#ffffff" />
      <circle cx="-2" cy="-20" r="3.5" fill="#f87171" />
      <circle cx="0" cy="115" r="3" fill="#fb923c" />
    </g>
  </g>
</svg>
